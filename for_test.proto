syntax = "proto3";

package atomos;
option go_package = "github.com/hwangtou/go-atomos;atomos";

import "atomos.proto";

// NOTE: this file backs the framework's own tests only. After regenerating
// with
//   protoc -I. --go_out=. --go_opt=paths=source_relative \
//     --go-atomos_out=. --go-atomos_opt=paths=source_relative for_test.proto
// rename the outputs to for_test_pb_test.go and for_test_atomos_pb_test.go so
// the ForTest* symbols stay out of the production export surface (they cannot
// move to an internal/testatom subpackage: in-package tests importing a
// subpackage that imports atomos would be an import cycle).

// ForTestData is the spawn-time data for both Element and Atom.
message ForTestData {
  string name = 1;
}

// ForTestHello is an Element-level RPC.
message ForTestHelloI {
  string message = 1;
}
message ForTestHelloO {
  int32 id = 1;
}

// ForTestSpawnArg is the argument for Atom spawn.
message ForTestSpawnArg {
  string name = 1;
}

// ForTestGreeting is an Atom-level RPC.
message ForTestGreetingI {
  enum TestMode {
    None = 0;
    SyncSelfCallDeadlock = 1;
  }
  TestMode mode = 1;
}
message ForTestGreetingO {}

service ForTestAtomos {
  // Element-level (using explicit option)
  rpc ElementSpawn (atomos.Nil) returns (ForTestData) {
    option (atomos.atomos_method) = AtomosElementSpawn;
  }
  rpc ElementSayHello (ForTestHelloI) returns (ForTestHelloO) {
    option (atomos.atomos_method) = AtomosElementMethod;
  }

  // Atom-level (using explicit option)
  rpc Spawn (ForTestSpawnArg) returns (ForTestData) {
    option (atomos.atomos_method) = AtomosAtomSpawn;
  }
  rpc Greeting (ForTestGreetingI) returns (ForTestGreetingO) {
    option (atomos.atomos_method) = AtomosAtomMethod;
  }
}
