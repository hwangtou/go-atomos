# Continuous integration for go-atomos.
#
# Mirrors the gates documented in AGENTS.md and the Makefile targets:
# build + vet (stdlib and atomos-vet analyzers) + full test suite
# (including the generator golden-file test), race detector (-count=2),
# integration tests against an embedded etcd, and the Windows root-module
# cross-compile gate. The check job installs protoc and runs the generator
# golden test explicitly so a missing compiler cannot silently skip it.

name: CI

on:
  push:
    branches: [master, v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, vet & test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            supervisor/go.sum
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Generator golden test (must not skip)
        run: |
          set -o pipefail
          go test -v ./protoc-gen-go-atomos/ -run '^TestGolden$' -count=1 | tee /tmp/go-atomos-golden.log
          ! grep -q -- '--- SKIP: TestGolden' /tmp/go-atomos-golden.log
      - name: Build
        run: go build ./...
      - name: Vet (stdlib + atomos-vet)
        run: make vet
      - name: Test
        run: go test ./... -count=1 -timeout 600s
      - name: Test supervisor module
        run: |
          cd supervisor
          go test ./... -count=1 -timeout 600s

  race:
    name: Race detector (all modules, -count=2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            go.sum
            supervisor/go.sum
      - name: Test with race detector, twice
        run: make test-race

  integration:
    name: Integration (embedded etcd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            go.sum
            supervisor/go.sum
      - name: Integration tests
        run: make test-integration
      - name: Integration tests with race detector
        run: make test-integration-race

  cross-build:
    name: Cross-compile (windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: |
            go.sum
            supervisor/go.sum
      - name: Windows root-module build gate (supervisor is Unix-only)
        run: make cross-build
