syntax = "proto3";

package atomos;
option go_package = "github.com/hwangtou/go-atomos;atomos";

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/descriptor.proto";

enum IDType {
  InvalidIDType = 0;
  Cosmos = 1;
  Element = 2;
  Atom = 3;
}

message IDInfo {
  IDType type = 1;
  string cosmos = 2;
  string node = 3;
  string element = 4;
  string atom = 5;
  uint64 version = 6;
  uint64 instance_id = 7;
  uint64 incarnation = 8;
  uint64 startup_id = 9;
  uint64 fence = 10;
  uint32 shard_id = 11;
}

enum LogLevel {
  Debug = 0;
  Info = 1;
  Warn = 2;
  CoreInfo = 3;
  Err = 4;
  Fatal = 5;
  CoreErr = 6;
  CoreFatal = 7;
}

message LogMail {
  IDInfo id = 1;
  google.protobuf.Timestamp time = 2;
  LogLevel level = 3;
  string message = 4;
}

message Error {
  int64 code = 1;
  string message = 2;
  repeated ErrorCallerInfo call_stacks = 5;
  string operation_id = 6;
}

message ErrorCallerInfo {
  IDInfo id = 1;
  string panic_stack = 2;
  string panic_reason = 3;
  string file = 4;
  uint32 line = 5;
  repeated string args = 6;
}

// Types

message Nil {}

message Bool {
  bool b = 1;
}

message Int32 {
  int32 n = 1;
}
message Int32s {
  repeated int32 ns = 1;
}

message Int64 {
  int64 n = 1;
}
message Int64s {
  repeated int64 ns = 1;
}

message UInt32 {
  uint32 n = 1;
}
message UInt32s {
  repeated uint32 ns = 1;
}

message UInt64 {
  uint64 n = 1;
}
message UInt64s {
  repeated uint64 ns = 1;
}

message Float32 {
  float f = 1;
}
message Float32s {
  repeated float fs = 1;
}

message Float64 {
  double f = 1;
}
message Float64s {
  repeated double fs = 1;
}

message String {
  string s = 1;
}
message Strings {
  repeated string ss = 1;
}

message Bytes {
  bytes b = 1;
}

// Configuration

message Config {
  // Cosmos Name
  string cosmos = 1;

  // Node Name (For Node Config)
  string node = 2;

  LogLevel log_level = 3;
  string log_path = 4;
  int64 log_max_size = 5;

  string build_path = 6;
  string bin_path = 7;
  string run_path = 8;
  string etc_path = 9;

  // 节点通讯
  CosmosClusterConfig enable_cluster = 10;

  // 启动元素
  repeated string enable_elements = 11;

  // 自定义配置
  map<string, bytes> customize = 12;
}

message CosmosClusterConfig{
  // 是否使用集群
  bool enable = 1;

  // etcd节点
  repeated string etcd_endpoints = 2;

  repeated int32 optional_ports = 3;

  // 证书配置
  CertConfig enable_cert = 4;

  // 仅允许本机/测试传输使用无认证模式。
  bool allow_insecure = 5;
  // 允许执行远程节点管理操作的已认证节点。
  repeated string admin_nodes = 6;
}

message CertConfig {
  string cert_path = 1;
  string key_path = 2;
  bool insecure_skip_verify = 3;
  string client_cert_path = 4;
  string client_key_path = 5;
  string client_ca_path = 6;
}

message ElementConfig {
  string name = 1;
  uint64 version = 2;
  map<string, AtomMessageConfig> messages = 3;
}

message AtomMessageConfig {
  google.protobuf.Any in = 1;
  google.protobuf.Any out = 2;
}

// Cosmos Requester

message IDTrackerInfo {
  string file = 1;
  int32 line = 2;
  string name = 3;
}

// Try to call "Broadcast" on Element.
message ElementBroadcastI {
  string key = 1;
  string content_type = 2;
  bytes content_buffer = 3;
}
message ElementBroadcastO {}

// Cluster Supports

message CosmosNodeVersionInfo {
  string node = 1;
  string address = 2;
  IDInfo id = 3;
  ClusterNodeState state = 4;
  map<string, IDInfo> elements = 5;
  // startup_id identifies the process generation (CosmosProcess.startupID,
  // unix-nano at boot). When a node restarts and reuses the same address, a
  // changed startup_id tells peers this is a NEW process instance, so they
  // must drop the old connection/state instead of treating it as the same
  // version registration.
  uint64 startup_id = 6;
  uint32 protocol_version = 7;
}

enum ClusterNodeState {
  ClusterNodeStateInvalid = 0;
  Starting = 1;
  Started = 2;
  // Draining precedes Stopping: a node drains (stop new atoms, serve existing)
  // before it stops (kill all atoms, exit). The numeric order mirrors lifecycle.
  Draining = 3;
  Stopping = 4;
  Stopped = 5;
}

message CosmosNodeVersionLock {
  int64 current = 1;
  repeated int64 versions = 2;
}

// AtomosMethodType classifies a service rpc as Element-level or Atom-level.
// Used via the atomos_method custom option. When the option is absent
// (AtomosMethodAuto), protoc-gen-go-atomos falls back to name-prefix convention
// ("Element*" prefix = Element method, "Spawn" = Atom spawn).
extend google.protobuf.MethodOptions {
  optional AtomosMethodType atomos_method = 50001;
}

enum AtomosMethodType {
  // Auto: determine by name prefix (backward compatible). This is the default.
  AtomosMethodAuto = 0;
  // Element-level method (runs on the singleton Element instance).
  AtomosElementMethod = 1;
  // Atom-level method (runs on a named Atom instance).
  AtomosAtomMethod = 2;
  // Element spawn (the ElementSpawn rpc).
  AtomosElementSpawn = 3;
  // Atom spawn (the Spawn rpc).
  AtomosAtomSpawn = 4;
}

enum AtomLifecycleState {
  AtomLifecycleStateUnknown = 0;
  AtomLifecycleStateAbsent = 1;
  AtomLifecycleStateSpawning = 2;
  AtomLifecycleStateRunning = 3;
  AtomLifecycleStateStopping = 4;
  AtomLifecycleStateHalted = 5;
}

enum AtomOperationKind {
  AtomOperationKindUnknown = 0;
  AtomOperationKindSpawn = 1;
  AtomOperationKindHalt = 2;
  AtomOperationKindTakeover = 3;
}

enum AtomOperationState {
  AtomOperationStateUnknown = 0;
  AtomOperationStateRunning = 1;
  AtomOperationStateSucceeded = 2;
  AtomOperationStateFailed = 3;
}

message AtomOwnershipInfo {
  IDInfo id = 1;
  uint64 incarnation = 2;
  uint64 startup_id = 3;
  uint64 fence = 4;
  AtomLifecycleState state = 5;
}

message AtomOperationInfo {
  string operation_id = 1;
  AtomOperationKind kind = 2;
  AtomOperationState state = 3;
  IDInfo id = 4;
  string fingerprint = 5;
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp finish_time = 7;
  Error error = 8;
  int64 retain_until_unix_nano = 9;
}

message AtomControlResult {
  string operation_id = 1;
  IDInfo id = 2;
  AtomOwnershipInfo ownership = 3;
  AtomOperationInfo operation = 4;
  Error error = 5;
}

message AtomLifecycleRecord {
  string element = 1;
  string atom = 2;
  uint64 next_fence = 3;
  AtomLifecycleState terminal = 4;
  IDInfo terminal_id = 5;
}

message AtomOwnershipRecord {
  AtomOwnershipInfo ownership = 1;
  int64 lease_id = 2;
  string operation_id = 3;
}

message ShardLifecycleRecord {
  uint32 shard_id = 1;
  uint64 next_fence = 2;
}

message ShardOwnershipRecord {
  uint32 shard_id = 1;
  uint64 fence = 2;
  uint64 startup_id = 3;
  string node = 4;
  int64 lease_id = 5;
}

message AtomOperationRecord {
  AtomOperationInfo operation = 1;
  AtomControlResult result = 2;
}

service AtomosRemoteService {
  rpc TryKilling(CosmosRemoteTryKillingReq) returns (CosmosRemoteTryKillingRsp) {}

  // DrainNode tells the target node to stop accepting new atoms (enter Draining
  // state), keep serving existing atoms until they finish, then exit gracefully.
  rpc DrainNode(CosmosRemoteDrainNodeReq) returns (CosmosRemoteDrainNodeRsp) {}

  rpc GetAtomID(CosmosRemoteGetAtomIDReq) returns (CosmosRemoteGetAtomIDRsp) {}
  rpc GetIDState(CosmosRemoteGetIDStateReq) returns (CosmosRemoteGetIDStateRsp) {}
  rpc GetIDIdleTime(CosmosRemoteGetIDIdleTimeReq) returns (CosmosRemoteGetIDIdleTimeRsp) {}
  rpc GetElementInfo(CosmosRemoteGetElementInfoReq) returns (CosmosRemoteGetElementInfoRsp) {}

  rpc SpawnAtom(CosmosRemoteSpawnAtomReq) returns (CosmosRemoteSpawnAtomRsp) {}
  rpc SyncMessagingByName(CosmosRemoteSyncMessagingByNameReq) returns (CosmosRemoteSyncMessagingByNameRsp) {}
  rpc AsyncMessagingByName(CosmosRemoteAsyncMessagingByNameReq) returns (CosmosRemoteAsyncMessagingByNameRsp) {}
  rpc AsyncOnMessageCallback(CosmosRemoteAsyncOnMessageCallbackReq) returns (CosmosRemoteAsyncOnMessageCallbackRsp) {}
  rpc KillAtom(CosmosRemoteKillAtomReq) returns (CosmosRemoteKillAtomRsp) {}

  rpc ElementBroadcast(CosmosRemoteElementBroadcastReq) returns (CosmosRemoteElementBroadcastRsp) {}

  rpc SpawnAtomControlled(CosmosRemoteSpawnAtomControlledReq) returns (CosmosRemoteSpawnAtomControlledRsp) {}
  rpc HaltAtomControlled(CosmosRemoteHaltAtomControlledReq) returns (CosmosRemoteHaltAtomControlledRsp) {}
  rpc LookupAtom(CosmosRemoteLookupAtomReq) returns (CosmosRemoteLookupAtomRsp) {}
  rpc GetAtomOperation(CosmosRemoteGetAtomOperationReq) returns (CosmosRemoteGetAtomOperationRsp) {}
  rpc TakeoverAtom(CosmosRemoteTakeoverAtomReq) returns (CosmosRemoteTakeoverAtomRsp) {}
}

// Try Killing Remote
message CosmosRemoteTryKillingReq {}
message CosmosRemoteTryKillingRsp {
  Error error = 1;
}

// Drain Node — request graceful drain (stop new atoms, finish existing, then exit)
message CosmosRemoteDrainNodeReq {
  // deadline_sec is the max seconds to wait for existing atoms to finish.
  // 0 means use the node's default. After the deadline the node force-stops.
  int64 deadline_sec = 1;
}
message CosmosRemoteDrainNodeRsp {
  Error error = 1;
}

// Get Atom ID
message CosmosRemoteGetAtomIDReq {
  string element = 1;
  string atom = 2;
}
message CosmosRemoteGetAtomIDRsp {
  IDInfo id = 1;
  Error error = 2;
}

// Get ID State
message CosmosRemoteGetIDStateReq {
  IDInfo id = 1;
}
message CosmosRemoteGetIDStateRsp {
  Error error = 1;
  int32 state = 2;
}

// Get Idle Time
message CosmosRemoteGetIDIdleTimeReq {
  IDInfo id = 1;
}
message CosmosRemoteGetIDIdleTimeRsp {
  Error error = 1;
  int64 idle_time = 2;
}

// Get Element Info
message CosmosRemoteGetElementInfoReq {
  string element = 1;
}
message CosmosRemoteGetElementInfoRsp {
  uint64 atoms_num = 1;
  uint64 active_atoms_num = 2;
}

// Spawn Atom
message CosmosRemoteSpawnAtomReq {
  IDInfo caller_id = 1;
  string element = 3;
  string atom = 4;
  google.protobuf.Any args = 5;
  CosmosArgs cosmos_args = 6;
}
message CosmosRemoteSpawnAtomRsp {
  IDInfo id = 1;
  Error error = 2;
}

// Sync Messaging
message CosmosRemoteSyncMessagingByNameReq {
  IDInfo caller_id = 1;
  IDInfo to = 3;
  CosmosArgs cosmos_args = 4;
  string message = 5;
  google.protobuf.Any args = 6;
}
message CosmosRemoteSyncMessagingByNameRsp {
  google.protobuf.Any reply = 1;
  Error error = 2;
}

// Async Messaging
message CosmosRemoteAsyncMessagingByNameReq {
  IDInfo caller_id = 1;
  IDInfo to_id = 2;
  CosmosArgs cosmos_args = 3;
  uint64 startup_id = 4;
  uint64 async_id = 5;
  string message = 6;
  google.protobuf.Any args = 7;
  string message_id = 8;
}
message CosmosRemoteAsyncMessagingByNameRsp {
  Error error = 1;
}

// Async On Message Callback
message CosmosRemoteAsyncOnMessageCallbackReq {
  IDInfo to_id = 1;
  IDInfo callback_id = 2;
  uint64 startup_id = 3;
  uint64 async_id = 4;
  string message = 5;
  google.protobuf.Any args = 6;
  Error error = 7;
  IDInfo caller_id = 8;
}
message CosmosRemoteAsyncOnMessageCallbackRsp {
  Error error = 1;
}

// Kill Atom
message CosmosRemoteKillAtomReq {
  IDInfo caller_id = 1;
  IDInfo id = 3;
  CosmosArgs cosmos_args = 4;
}
message CosmosRemoteKillAtomRsp {
  Error error = 1;
}

// Element Broadcast
message CosmosRemoteElementBroadcastReq {
  IDInfo caller_id = 1;
  string key = 3;
  string content_type = 4;
  bytes content_buffer = 5;
}
message CosmosRemoteElementBroadcastRsp {
  Error error = 1;
}

message CosmosArgs {
  repeated int32 types = 1;
  int64 base_atomos_timeout_in_nano = 2;
  bool base_atomos_append_to_head = 3;
  bool base_atomos_wait_killed = 4;
  // Cross-node sync-call wait chain (added for cross-node deadlock
  // detection): the IDs of atoms already blocking this call, outermost
  // first. Entries use IDInfo.Info() format. Older nodes ignore it and
  // degrade to timeout-based protection.
  repeated string wait_chain = 5;
  uint32 protocol_version = 6;
}

// Controlled atom lifecycle operations. The response-level error reports a
// query/transport-handling failure; result.error is the accepted operation's
// business result. A formed control result is returned with transport OK.
message CosmosRemoteSpawnAtomControlledReq {
  IDInfo caller_id = 1;
  string element = 2;
  string atom = 3;
  google.protobuf.Any args = 4;
  CosmosArgs cosmos_args = 5;
  string operation_id = 6;
  AtomOwnershipInfo expected_ownership = 7;
  string fingerprint = 8;
  bool retain = 9;
}
message CosmosRemoteSpawnAtomControlledRsp {
  Error error = 1;
  AtomControlResult result = 2;
}

message CosmosRemoteHaltAtomControlledReq {
  IDInfo caller_id = 1;
  IDInfo id = 2;
  CosmosArgs cosmos_args = 3;
  string operation_id = 4;
  AtomOwnershipInfo expected_ownership = 5;
  string fingerprint = 6;
  bool retain = 7;
}
message CosmosRemoteHaltAtomControlledRsp {
  Error error = 1;
  AtomControlResult result = 2;
}

message CosmosRemoteLookupAtomReq {
  IDInfo id = 1;
}
message CosmosRemoteLookupAtomRsp {
  Error error = 1;
  AtomLifecycleState state = 2;
  AtomOwnershipInfo ownership = 3;
  AtomOperationInfo operation = 4;
  IDInfo id = 5;
}

message CosmosRemoteGetAtomOperationReq {
  string operation_id = 1;
}
message CosmosRemoteGetAtomOperationRsp {
  Error error = 1;
  AtomOperationInfo operation = 2;
}

message CosmosRemoteTakeoverAtomReq {
  IDInfo caller_id = 1;
  IDInfo id = 2;
  string operation_id = 3;
  AtomOwnershipInfo expected_ownership = 4;
  string fingerprint = 5;
  bool retain = 6;
  IDInfo previous_id = 7;
  google.protobuf.Any args = 8;
  CosmosArgs cosmos_args = 9;
}
message CosmosRemoteTakeoverAtomRsp {
  Error error = 1;
  AtomControlResult result = 2;
}
